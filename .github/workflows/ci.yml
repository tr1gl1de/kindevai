name: CI
# Checks on every PR to dev and every push to dev; a green push to dev also publishes the dev pre-release.
# Production releases live in release.yml and run only for owner-created v* tags on main (KIN-A-20).
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - run: npm --prefix web ci
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Go tests with coverage (-race)
        run: make cover
      - name: Web tests
        run: npm --prefix web test -- --run
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: make vuln

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: make build
      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose profiles
        run: |
          docker compose config -q
          DOMAIN=ai.example.com docker compose --profile https config -q
          # Only Caddy may publish non-loopback ports.
          DOMAIN=ai.example.com docker compose --profile https config --format json \
            | jq -e '[.services.cp.ports[] | select(.host_ip != "127.0.0.1")] | length == 0'
          DOMAIN=ai.example.com docker compose --profile https config --format json \
            | jq -e '[.services.caddy.ports[].target] | sort == [80, 443, 443]'
      - name: Build Control Plane image (no push)
        run: docker build --build-arg VERSION=ci-${GITHUB_SHA::7} -t kindevai:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name cp -p 127.0.0.1:8080:8080 kindevai:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' cp)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' cp | grep -qx healthy
          curl -fsS 127.0.0.1:8080/api/health
          curl -fsS 127.0.0.1:8080/ | grep -q '<div id="root">'
          docker exec cp ai-platform setup-token | grep -qE '^[A-Za-z0-9_-]{43}$'
          [ "$(docker inspect -f '{{.Config.User}}' cp)" = "65532:65532" ]
      - name: Clean up
        if: always()
        run: docker rm -f cp || true

  # ---- Dev pre-release: only for pushes to dev, only after every check above is green ----

  dev-binaries:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [lint, test, vuln, build, workflows, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # replaces the "dev" pre-release; cannot touch main (no push, no PR)
    concurrency:
      group: release-dev
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Snapshot build (linux/darwin × amd64/arm64)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Publish the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/*.tar.gz dist/SHA256SUMS \
            --prerelease --target "$GITHUB_SHA" \
            --title "dev (${GITHUB_SHA::7})" \
            --notes "Automatic build of the dev branch at ${GITHUB_SHA}. Not a release; may break at any time."

  dev-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [lint, test, vuln, build, workflows, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-dev-image
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=dev-${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
