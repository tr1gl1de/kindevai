name: CI
# Checks on every PR and push to dev and main; a green push to dev also publishes the dev pre-release
# (separate package ghcr.io/<repo>-dev and the "dev" pre-release tag only).
# Production releases live in release.yml and run only for owner-created v* tags on main (KIN-A-20).
on:
  pull_request:
    branches: [dev, main] # main: the owner's promotion PR gets the same checks
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - run: npm --prefix web ci
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Go tests with coverage (-race)
        run: make cover
      - name: Web tests
        run: npm --prefix web test -- --run
      - name: Git guard hook tests
        run: make test-hooks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: make vuln

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: make build
      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: check

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: -color

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose profiles
        run: |
          docker compose config -q
          DOMAIN=ai.example.com docker compose --profile https config -q
          # Only Caddy may publish non-loopback ports.
          DOMAIN=ai.example.com docker compose --profile https config --format json \
            | jq -e '[.services.cp.ports[] | select(.host_ip != "127.0.0.1")] | length == 0'
          DOMAIN=ai.example.com docker compose --profile https config --format json \
            | jq -e '[.services.caddy.ports[].target] | sort == [80, 443, 443]'
      - name: Build Control Plane image (no push)
        run: docker build --build-arg "VERSION=ci-${GITHUB_SHA::7}" -t kindevai:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name cp -p 127.0.0.1:8080:8080 kindevai:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' cp)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' cp | grep -qx healthy
          curl -fsS 127.0.0.1:8080/api/health
          curl -fsS 127.0.0.1:8080/ | grep -q '<div id="root">'
          docker exec cp ai-platform setup-token | grep -qE '^[A-Za-z0-9_-]{43}$'
          [ "$(docker inspect -f '{{.Config.User}}' cp)" = "65532:65532" ]
      - name: Clean up
        if: always()
        run: docker rm -f cp || true

  # ---- Dev pre-release: only for pushes to dev, only after every check above is green ----

  dev-binaries:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [lint, test, vuln, build, workflows, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # moves the "dev" tag and updates the "dev" pre-release; never touches main
    concurrency:
      group: release-dev
      cancel-in-progress: false # never stop half-way through updating the pre-release; runs queue instead
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Snapshot build (linux/darwin × amd64/arm64)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Publish the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="dev (${GITHUB_SHA::7})"
          notes="Automatic build of the dev branch at ${GITHUB_SHA}. Not a release; may break at any time."
          git tag -f dev "$GITHUB_SHA"
          git push -f origin refs/tags/dev
          if gh release view dev >/dev/null 2>&1; then
            gh release view dev --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset dev "$asset" --yes
            done
            gh release edit dev --prerelease --title "$title" --notes "$notes"
          else
            gh release create dev --prerelease --verify-tag --title "$title" --notes "$notes"
          fi
          gh release upload dev dist/*.tar.gz dist/SHA256SUMS --clobber

  dev-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [lint, test, vuln, build, workflows, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-dev-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=dev-${{ github.sha }}
          # A separate package from production images: dev workflows never write ghcr.io/<repo>.
          tags: |
            ghcr.io/${{ github.repository }}-dev:latest
            ghcr.io/${{ github.repository }}-dev:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
