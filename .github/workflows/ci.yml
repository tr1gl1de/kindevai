name: CI
# Checks on every PR and push to dev and main; a green push to dev also publishes dev builds
# (binaries as run artifacts, image in the separate package ghcr.io/<repo>-dev).
# Production releases live in release.yml and run only for owner-created v* tags on main (KIN-A-20).
on:
  pull_request:
    branches: [dev, main] # main: the owner's promotion PR gets the same checks
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - run: npm --prefix web ci
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Go tests with coverage (-race)
        run: make cover
      - name: Web tests
        run: npm --prefix web test -- --run
      - name: Git guard hook tests
        run: make test-hooks
      - name: Helper script tests
        run: make test-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  # Integration tests (//go:build integration), e.g. the strict egress sandbox (KIN-31): real user, network and
  # mount namespaces with nftables, so the job enables unprivileged user namespaces and installs nft.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Enable unprivileged user namespaces and install nftables
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update -q && sudo apt-get install -y -q nftables
      - run: make test-integration
        env:
          KINDEV_REQUIRE_SANDBOX: "1" # the sandbox tests must run here, never skip

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: make vuln

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: make build
      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: -color

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose profiles
        run: |
          docker compose config -q
          DOMAIN=ai.example.com docker compose --profile https config -q
          # Only Caddy may publish non-loopback ports.
          DOMAIN=ai.example.com docker compose --profile https config --format json \
            | jq -e '[.services.cp.ports[] | select(.host_ip != "127.0.0.1")] | length == 0'
          DOMAIN=ai.example.com docker compose --profile https config --format json \
            | jq -e '[.services.caddy.ports[].target] | sort == [80, 443, 443]'
      - name: Build Control Plane image (no push)
        run: docker build --build-arg "VERSION=ci-${GITHUB_SHA::7}" -t kindevai:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name cp -p 127.0.0.1:8080:8080 kindevai:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' cp)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' cp | grep -qx healthy
          curl -fsS 127.0.0.1:8080/api/health
          curl -fsS 127.0.0.1:8080/ | grep -q '<div id="root">'
          docker exec cp ai-platform setup-token | grep -qE '^[A-Za-z0-9_-]{43}$'
          [ "$(docker inspect -f '{{.Config.User}}' cp)" = "65532:65532" ]
      - name: Clean up
        if: always()
        run: docker rm -f cp || true

  # ---- Dev builds: only for pushes to dev, only after every check above is green ----

  dev-binaries:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [lint, test, vuln, build, workflows, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Snapshot build (linux/darwin × amd64/arm64)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean
      # Run artifacts, not a release: a moving tag would need the `workflows` permission (GITHUB_TOKEN never has
      # it) whenever dev changes a workflow file, and a tag named like the dev branch makes `dev` ambiguous.
      - name: Upload the dev binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-platform-dev-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  dev-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [lint, test, vuln, build, workflows, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-dev-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=dev-${{ github.sha }}
          # A separate package from production images: dev workflows never write ghcr.io/<repo>.
          tags: |
            ghcr.io/${{ github.repository }}-dev:latest
            ghcr.io/${{ github.repository }}-dev:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
