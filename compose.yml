# Zero-config deployment (KIN-A-27). No .env is required.
#   Local HTTP:   docker compose up -d                                   → http://127.0.0.1:8080
#   Public HTTPS: DOMAIN=ai.example.com docker compose --profile https up -d
# First-run setup token: docker compose exec cp ai-platform setup-token

name: kindevai

services:
  cp:
    image: ghcr.io/tr1gl1de/kindevai:${KINDEV_IMAGE_TAG:-local}
    build:
      context: .
      args:
        VERSION: ${KINDEV_VERSION:-local}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      # Loopback only: the plain-HTTP profile must never become a public endpoint by default.
      - "127.0.0.1:${KINDEV_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp # SQLite temp files with a read-only root filesystem
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 20s

  caddy:
    profiles: [https]
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      cp:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

volumes:
  data:
  caddy_data:
  caddy_config:
